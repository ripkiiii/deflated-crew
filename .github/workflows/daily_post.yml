name: Deflated Daily Post

on:
  schedule:
    - cron: "0 1 * * *"  # 08:00 WIB (UTC+7)
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Research
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python deflated_research.py

      - name: Generate thread
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python deflated_content.py

      - name: Post to Bluesky
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python deflated_post.py

      - name: Upload thread artifact
        uses: actions/upload-artifact@v4
        with:
          name: thread-${{ github.run_id }}
          path: thread_*.md
